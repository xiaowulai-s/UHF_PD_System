# UHF-AE PD Detection System
# Python 3.10+ | PySide6

[project]
name = "uhf-ae-pd-detector"
version = "1.1.0"
description = "超高频超声波局部放电检测系统 - UHF/AE dual-modality PD detection platform"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "PySide6>=6.6.0",
    "PySide6-Addons>=6.6.0",
    "pyqtgraph>=0.13.0",
    "openpyxl>=3.1.0",
    "pyserial>=3.5",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "structlog>=23.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "toml>=0.10.2",
]

